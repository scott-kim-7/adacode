# Ada Model Registry — profile → OpenAI-compatible endpoint (model id from GET /v1/models)
# See docs/ada/step2/README.md

profiles:
  chat_profile:
    label: Local LLM (OpenAPI)
    provider: openai-compatible
    base_url: http://127.0.0.1:8080/v1
    api_key: local
    tool_calling: true
    notes: Model id resolved at runtime via /v1/models on base_url.

  external_profile:
    label: External API LLM
    provider: openai-compatible
    base_url: https://api.openai.com/v1
    api_key_vault: external.openai.api_key
    tool_calling: false
    notes: Model id from /v1/models. API key only in vault (make vault-set KEY=external.openai.api_key).

  regression_profile:
    label: Regression (local OpenAPI)
    provider: openai-compatible
    base_url: http://127.0.0.1:8080/v1
    api_key: local
    tool_calling: true
    notes: Same endpoint as chat_profile; model resolved via OpenAPI.

tri_chat:
  turn_order:
    - user
    - local
    - external
  local_profile: chat_profile
  external_profile: external_profile
