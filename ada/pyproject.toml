[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada"
version = "0.1.0"
description = "Ada AI orchestration — Model Registry, vault, local LLM CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"pyyaml>=6.0",
	"httpx>=0.27",
	"cryptography>=42.0",
	"langgraph>=0.2.60",
	"langchain-core>=0.3.0",
	"fastapi>=0.115",
	"pydantic>=2.0",
	"uvicorn>=0.32",
	"google-api-python-client>=2.100",
	"google-auth-oauthlib>=1.2",
	"google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ada = "ada.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
	"regression: release contract tests — run with pytest -m regression",
	"eval_smoke: Agent eval smoke gates — run with pytest -m eval_smoke",
]
